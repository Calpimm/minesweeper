name: Deploy server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Skipped until Cloudflare is set up (see docs/RELEASING.md).
    if: vars.D1_DATABASE_ID != ''
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Point wrangler.toml at the production database
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
